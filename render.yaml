# Render Blueprint — https://render.com/docs/blueprint-spec
#
# With this in the repo, Render's "New + → Blueprint" reads the whole service
# definition instead of asking for it field by field, and prompts only for the
# secrets. That removes the two settings most likely to be got wrong by hand:
# PORT (Render assigns it; a fixed value means the health check never passes)
# and HUMSAFAR_BACKEND_URL (the server derives it from the port it actually
# bound; a stale value makes every run publish its events into the void).
#
# Neither appears below, deliberately.

services:
  - type: web
    name: humsafar
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # Generated by Render, never checked in. INTERNAL_API_TOKEN is required
      # for a non-loopback bind — server.js refuses to start without it — and
      # SESSION_SECRET signs the browser cookie that replaces the Vite dev
      # proxy once deployed.
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      # Prompted at deploy time. Copy from the local .env; never commit them.
      - key: PRAVA_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Without this the mapped itinerary returns 503 and the intake loses its
      # suggestions — the most easily missed of the lot.
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: DUFFEL_ACCESS_TOKEN
        sync: false
      - key: PRAVA_TEST_CUSTOMER_EMAIL
        sync: false
      # Set to the service's own https URL after the first deploy. Prava
      # rejects a non-https callback_url, so the payment return stays inert
      # until this is real.
      - key: PUBLIC_BASE_URL
        sync: false

      - key: PRAVA_BASE_URL
        value: https://sandbox.api.prava.space
      - key: PRAVA_TEST_CUSTOMER_ID
        value: humsafar-demo-user
      - key: PRAVA_MANDATE_MERCHANTS_JSON
        value: "{}"
      # Two runs fit a 512MB instance alongside Node. Each run spawns a Python
      # process, so this is a memory ceiling, not a policy.
      - key: HUMSAFAR_MAX_CONCURRENT_RUNS
        value: "2"
      # Agent mandate charges hit the Visa credential fault, which would fill a
      # deployed receipt with red failures. The human hosted checkout is
      # unaffected and stays available.
      - key: HUMSAFAR_LIVE_CARDS
        value: "false"
      - key: HUMSAFAR_LIVE_CHECKOUT
        value: "false"
